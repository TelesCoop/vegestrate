pipeline:
  output_name: lyon_2015_ir_08
  splits: [test]

data: # data_preparation/prepare_training_data_grandlyon.py or _2015.py (auto-selected by "2015" in manifest filename)
  manifest: data/dataset_manifest_grandlyon_2015.json
  resolution: 0.8
  workers: 14
  ir_mosaic: null
  download_ir: false

inference: # inference/inference_flair_context.py
  checkpoint: FLAIR-HUB_LC-A_RGB_swinlarge-upernet.safetensors
  download_checkpoint: false
  tile_size: 512
  overlap: 256
  grid_step: 5
  tta: false
  tta_modes: null  # e.g. [hflip, vflip, hvflip] — null means all three
  batch_size: 64
  fp16: true
  compile: true
  use_ir: false  # Grand Lyon 2015 IRC WCS layer is radiometrically far brighter
                 # than FLAIR-HUB's training distribution (measured mean ~210
                 # vs training's 106.6) and causes systematic over-prediction
                 # of herbaceous/grass. RGB channels are much closer to the
                 # training distribution, so use the RGB checkpoint instead.
  class_bias: null # e.g. ["1:2.0"] to boost herbaceous
  herb_margin: 0.0 # e.g. 3.0 to recover herbaceous from 'else'; 0 disables

merge: # postprocessing/merge_tifs.py
  strategy: mode
  smooth: false
  smooth_iterations: 3
  smooth_cores: 3
  resample_mismatch: false

clean_raster: # postprocessing/clean_raster.py
  sieve: 13
  mode_filter:
    kernel: 3
    iterations: 1
  buildings: null 
  buildings_value: null 
  transparent_else: true 
  morph_ops:  # legacy, set r_dil > 0 to use instead of mode filter
    - [dilate, 0]
    - [erode, 0]
    - [dilate, 0]

ndsm_merge: # postprocessing/merge_tifs.py (nDSM tiles)
  strategy: max

vegetation_elevation: # postprocessing/apply_vegetation_elevation.py
  nodata: -9999.0

vectorization: # postprocessing/vectorize_raster.py
  format: ESRI Shapefile
  eight_connected: false
  field_name: class

phases:
  data_preparation:
    enabled: true
    depends_on: []
  flair_inference:
    enabled: true
    depends_on: [data_preparation]
  lidar_flair_merge:
    enabled: true
    depends_on: [data_preparation, flair_inference]
  zone_elevation:
    enabled: true
    depends_on: [lidar_flair_merge]
  final_merge:
    enabled: true
    depends_on: [lidar_flair_merge]
  clean_raster:
    enabled: true
    depends_on: [final_merge]
  ndsm_merge:
    enabled: true
    depends_on: [data_preparation]
  vegetation_elevation:
    enabled: true
    depends_on: [clean_raster, ndsm_merge]
  vectorization:
    enabled: false
    depends_on: [clean_raster]
